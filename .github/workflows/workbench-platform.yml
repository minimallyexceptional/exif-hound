name: Workbench platform verification

on:
  push:
    branches: [feature/workbench-next]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages and frontend
        run: |
          npm run build:packages
          npm run build --workspace=exif-hound-desktop

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/exif-hound-desktop/src-tauri

      - name: Check Rust formatting
        run: cargo fmt --all -- --check
        working-directory: apps/exif-hound-desktop/src-tauri

      - name: Run native workflow-library tests
        run: cargo test --target ${{ matrix.target }}
        working-directory: apps/exif-hound-desktop/src-tauri

      - name: Build Tauri application without bundling
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: apps/exif-hound-desktop/src-tauri

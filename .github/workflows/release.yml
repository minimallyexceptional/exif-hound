name: Release

# Builds signed Exif Hound apps for Windows, Linux x86_64/ARM64, and Apple Silicon.
# Stable releases are triggered by v<version> tags. Manual runs can target
# the stable or internal update channel. See docs/updater.md

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Update channel (internal is for pre-release testing)'
        required: true
        default: 'stable'
        type: choice
        options: [stable, beta, internal]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.prepare.outputs.channel }}
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./apps/exif-hound-desktop/src-tauri/tauri.conf.json').version")
          echo "App version: $VERSION"

          if [ "$EVENT_NAME" = "push" ]; then
            CHANNEL=stable
            TAG="$REF_NAME"
            EXPECTED_TAG="v${VERSION}"
            if [ "$TAG" != "$EXPECTED_TAG" ]; then
              echo "::error::Tag $TAG does not match app version $VERSION (expected $EXPECTED_TAG)"
              exit 1
            fi
          else
            CHANNEL="$INPUT_CHANNEL"
            case "$CHANNEL" in
              stable)   TAG="v${VERSION}" ;;
              beta)     TAG="beta-v${VERSION}" ;;
              internal) TAG="internal-v${VERSION}" ;;
              *) echo "::error::Unsupported channel: $CHANNEL"; exit 1 ;;
            esac
          fi

          CONFIG=apps/exif-hound-desktop/src-tauri/tauri.conf.json
          if grep -q 'PLACEHOLDER_' "$CONFIG"; then
            echo "::error::$CONFIG still contains a placeholder updater public key."
            exit 1
          fi

          PRERELEASE=false
          if [ "$CHANNEL" != "stable" ] || [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          fi

          echo "channel=$CHANNEL"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"               >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Prepared: channel=$CHANNEL version=$VERSION tag=$TAG"

      - name: Check version consistency
        run: node scripts/release/check-version-consistency.mjs

      - name: Refuse already-published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $TAG is already published; refusing to overwrite it."
              exit 1
            fi
            echo "Release $TAG exists as a draft; continuing so it can be completed."
          else
            echo "Release $TAG does not exist yet; proceeding."
          fi

  build:
    name: ${{ matrix.os }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux ARM64 uses a native runner so bundles match the target architecture.
        include:
          - name: macos-14
            os: macos-14
            tauri_target: aarch64-apple-darwin
            updater_target: darwin-aarch64
          - name: ubuntu-latest-x86_64
            os: ubuntu-latest
            tauri_target: x86_64-unknown-linux-gnu
            updater_target: linux-x86_64
          - name: ubuntu-24.04-arm-aarch64
            os: ubuntu-24.04-arm
            tauri_target: aarch64-unknown-linux-gnu
            updater_target: linux-aarch64
          - name: windows-latest
            os: windows-latest
            tauri_target: x86_64-pc-windows-msvc
            updater_target: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.tauri_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/exif-hound-desktop/src-tauri

      # The consolidated app continues to trust the former Community key.
      # Secrets may contain newlines, so copy them through GITHUB_ENV blocks.
      - name: Configure updater signing key
        env:
          KEY_VALUE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_COMMUNITY }}
          PASSWORD_VALUE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_COMMUNITY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEY_VALUE" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_COMMUNITY is missing."
            exit 1
          fi
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<TAURI_KEY_EOF"
            printf '%s\n' "$KEY_VALUE"
            echo "TAURI_KEY_EOF"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<TAURI_PASSWORD_EOF"
            printf '%s\n' "$PASSWORD_VALUE"
            echo "TAURI_PASSWORD_EOF"
          } >> "$GITHUB_ENV"

      # Do not expose empty APPLE_* variables to Tauri. In particular, an
      # empty APPLE_SIGNING_IDENTITY is interpreted as a request to codesign
      # with identity "", which fails on GitHub-hosted macOS runners.
      - name: Configure optional Apple signing
        if: runner.os == 'macOS'
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARIZATION_ID: ${{ secrets.APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARIZATION_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_IDENTITY" ]; then
            if [ -n "$NOTARIZATION_ID$NOTARIZATION_PASSWORD$NOTARIZATION_TEAM" ]; then
              echo "::error::Apple notarization secrets require APPLE_SIGNING_IDENTITY."
              exit 1
            fi
            echo "No Apple signing identity configured; building unsigned."
            exit 0
          fi

          {
            echo "APPLE_SIGNING_IDENTITY<<APPLE_IDENTITY_EOF"
            printf '%s\n' "$SIGNING_IDENTITY"
            echo "APPLE_IDENTITY_EOF"
          } >> "$GITHUB_ENV"

          if [ -n "$NOTARIZATION_ID$NOTARIZATION_PASSWORD$NOTARIZATION_TEAM" ]; then
            if [ -z "$NOTARIZATION_ID" ] || [ -z "$NOTARIZATION_PASSWORD" ] || [ -z "$NOTARIZATION_TEAM" ]; then
              echo "::error::APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID must be configured together."
              exit 1
            fi
            {
              echo "APPLE_ID<<APPLE_ACCOUNT_EOF"
              printf '%s\n' "$NOTARIZATION_ID"
              echo "APPLE_ACCOUNT_EOF"
              echo "APPLE_PASSWORD<<APPLE_PASSWORD_EOF"
              printf '%s\n' "$NOTARIZATION_PASSWORD"
              echo "APPLE_PASSWORD_EOF"
              echo "APPLE_TEAM_ID<<APPLE_TEAM_EOF"
              printf '%s\n' "$NOTARIZATION_TEAM"
              echo "APPLE_TEAM_EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Build Exif Hound (${{ needs.prepare.outputs.channel }})
        env:
          EXIFHOUND_UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ARGS=(build --target "${{ matrix.tauri_target }}")
          if [ "$EXIFHOUND_UPDATE_CHANNEL" != "stable" ]; then
            BUILD_ARGS+=(--config "src-tauri/tauri.${EXIFHOUND_UPDATE_CHANNEL}.conf.json")
          fi

          # WiX/MSI rejects textual SemVer prerelease identifiers such as
          # 2.5.2-test.1. Internal Windows releases use the NSIS installer,
          # which is also the artifact consumed by the Tauri updater.
          if [ "$RUNNER_OS" = "Windows" ] && [ "$EXIFHOUND_UPDATE_CHANNEL" != "stable" ]; then
            BUILD_ARGS+=(--bundles nsis)
          fi

          npm run tauri --workspace=exif-hound-desktop -- \
            "${BUILD_ARGS[@]}"

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "staging/${{ matrix.updater_target }}"
          while IFS= read -r -d '' artifact; do
            cp "$artifact" "staging/${{ matrix.updater_target }}/"
          done < <(
            find "apps/exif-hound-desktop/src-tauri/target/${{ matrix.tauri_target }}/release/bundle" -type f \
              \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
                 -o -name '*.exe' -o -name '*.msi' -o -name '*.exe.sig' -o -name '*.msi.sig' \
                 -o -name '*.AppImage' -o -name '*.AppImage.sig' \
                 -o -name '*.deb' -o -name '*.rpm' \) -print0
          )
          ls -la "staging/${{ matrix.updater_target }}"

      - name: Verify updater signature exists
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS)   PATTERN='*.app.tar.gz.sig' ;;
            Windows) PATTERN='*-setup.exe.sig' ;;
            Linux)   PATTERN='*.AppImage.sig' ;;
          esac
          compgen -G "staging/${{ matrix.updater_target }}/$PATTERN" >/dev/null || {
            echo "::error::Missing updater signature $PATTERN for ${{ matrix.updater_target }}"
            exit 1
          }

      - name: Upload staged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: staging/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish release atomically
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: exif-hound-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download all staged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: staging/
          merge-multiple: true

      - name: Verify all expected platforms
        env:
          EXPECTED_TARGETS: 'darwin-aarch64 windows-x86_64 linux-x86_64 linux-aarch64'
        shell: bash
        run: |
          set -euo pipefail
          for target in $EXPECTED_TARGETS; do
            [ -d "staging/$target" ] || {
              echo "::error::Missing staged artifacts for $target"
              exit 1
            }
          done

      - name: Generate update manifest
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node scripts/updater/generate-update-manifest.mjs \
            --channel "$CHANNEL" \
            --version "$VERSION" \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --staging-dir staging \
            --out latest.json

      - name: Validate update manifest
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node scripts/updater/validate-update-manifest.mjs latest.json \
            --channel "$CHANNEL" \
            --version "$VERSION" \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --staging-dir staging

      - name: Publish release after every asset is uploaded
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-body.md <<BODY
          Installers for Exif Hound.
          macOS builds are for Apple Silicon (M-series).

          > Existing users should manually install this release. Once installed,
          > Exif Hound can download future signed updates directly in the app.
          > Update checks are anonymous and never include image or investigation data.
          BODY

          PRERELEASE_FLAG=()
          if [ "$PRERELEASE" = "true" ]; then PRERELEASE_FLAG=(--prerelease); fi
          mapfile -t assets < <(find staging -type f -print | sort)

          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $TAG is already published; refusing to overwrite it."
              exit 1
            fi
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              "${PRERELEASE_FLAG[@]}" \
              --draft \
              --title "Exif Hound v${VERSION}" \
              --notes-file release-body.md
          fi

          gh release upload "$TAG" "${assets[@]}" latest.json --clobber
          gh release edit "$TAG" --draft=false

          echo "Release $TAG published."
          echo "Publish latest.json to GitHub Pages channel: ${CHANNEL}"

      - name: Publish update manifest to GitHub Pages
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          node scripts/updater/publish-pages.mjs \
            --site-dir update-site \
            --channel "$CHANNEL" \
            --manifest latest.json

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published-site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: published-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (typecheck + jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Typecheck
        run: npm run typecheck --workspace=exif-hound-desktop

      - name: Run all tests
        run: npm run test --workspace=exif-hound-desktop

      - name: Run release-tooling tests (manifest generation/validation)
        run: npm run test:scripts

  rust-check:
    name: Rust check (tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tauri-build validates the frontendDist path at compile time
      - name: Build shared packages
        run: npm run build:packages

      - name: Build frontend dist
        run: npm run build --workspace=exif-hound-desktop

      - name: Install Linux dependencies (webkit2gtk / gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/exif-hound-desktop/src-tauri

      - name: cargo check
        run: cargo check
        working-directory: apps/exif-hound-desktop/src-tauri

      - name: cargo test
        run: cargo test
        working-directory: apps/exif-hound-desktop/src-tauri

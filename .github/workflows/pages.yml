name: Publish update site

on:
  push:
    branches: [main]
    paths:
      - 'update-site/**'
      - 'scripts/updater/publish-pages.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exif-hound-pages-publish
  cancel-in-progress: false

jobs:
  publish-site:
    name: Publish static site to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish site and preserve channel manifests
        run: node scripts/updater/publish-pages.mjs --site-dir update-site

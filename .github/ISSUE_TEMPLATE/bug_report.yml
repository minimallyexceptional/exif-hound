name: Bug report
description: Report something that is broken or behaves unexpectedly
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the details below.
        For security vulnerabilities, use [private reporting](https://github.com/minimallyexceptional/exif-hound/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: Exif Hound version
      description: From Settings → About, or the release tag
      placeholder: e.g. 2.6.5
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux (AppImage / deb / rpm)
        - Windows
        - macOS (Apple Silicon)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Import an image
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: |
        Run the app from a terminal to capture stdout, or attach screenshots.
        WARNING: do not paste private image data, metadata, or investigation files.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I am using the latest release
          required: true